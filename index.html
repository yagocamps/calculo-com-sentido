<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cálculo com Sentido · Layout do site</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; background: #efe9dd; }
    body { font-family: "DM Sans", system-ui, sans-serif; color: #2A211A; }
    * { box-sizing: border-box; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="src/tokens.jsx"></script>
  <script type="text/babel" src="src/Sidebar.jsx"></script>
  <script type="text/babel" src="src/Shell.jsx"></script>
  <script type="text/babel" src="src/pages/Home.jsx"></script>
  <script type="text/babel" src="src/pages/TesteNivel.jsx"></script>
  <script type="text/babel" src="src/pages/Trilhas.jsx"></script>
  <script type="text/babel" src="src/pages/Aula.jsx"></script>
  <script type="text/babel" src="src/pages/Exercicios.jsx"></script>
  <script type="text/babel" src="src/pages/Resumos.jsx"></script>
  <script type="text/babel" src="src/pages/Glossario.jsx"></script>
  <script type="text/babel" src="src/pages/MeuProgresso.jsx"></script>
  <script type="text/babel" src="src/pages/Sobre.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const W = 1440;
    const H = 940;
    const TALL = 1180;

    function App() {
      return (
        <DesignCanvas
          title="Cálculo com Sentido · Layout do site"
          subtitle="10 telas em alta fidelidade · sidebar fixa estilo doc · paleta acolhedora warm + terracota"
        >
          <DCSection
            id="entry"
            title="Entrada"
            subtitle="Primeiro contato — apresenta a proposta e direciona o aluno"
          >
            <DCArtboard id="home" label="Início (Home)" width={W} height={H}>
              <Home />
            </DCArtboard>
            <DCArtboard id="sobre" label="Sobre o projeto" width={W} height={TALL}>
              <Sobre />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="onboarding"
            title="Onboarding"
            subtitle="Teste de nível — descobrir por onde começar"
          >
            <DCArtboard id="teste" label="Teste de nível · pergunta em curso" width={W} height={H}>
              <TesteNivel />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="trilhas"
            title="Trilhas"
            subtitle="Listagem dos módulos de cada trilha"
          >
            <DCArtboard id="pre" label="Trilha · Pré-Cálculo" width={W} height={H}>
              <TrilhaPreCalculo />
            </DCArtboard>
            <DCArtboard id="calc" label="Trilha · Cálculo 1" width={W} height={H}>
              <TrilhaCalculo1 />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="conteudo"
            title="Conteúdo"
            subtitle="Modelo padrão de aula e de exercícios — onde o aluno passa a maior parte do tempo"
          >
            <DCArtboard id="aula" label="Aula · modelo padrão (12 seções)" width={W} height={TALL + 200}>
              <Aula />
            </DCArtboard>
            <DCArtboard id="exerc" label="Exercícios · lista + atividade aberta (9 partes)" width={W} height={TALL}>
              <Exercicios />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="referencia"
            title="Referência"
            subtitle="Materiais para consulta rápida — revisão de prova"
          >
            <DCArtboard id="resumos" label="Resumos rápidos" width={W} height={TALL}>
              <Resumos />
            </DCArtboard>
            <DCArtboard id="gloss" label="Glossário" width={W} height={H}>
              <Glossario />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="pessoal"
            title="Pessoal"
            subtitle="Onde o aluno acompanha a própria jornada"
          >
            <DCArtboard id="prog" label="Meu progresso" width={W} height={H}>
              <MeuProgresso />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
